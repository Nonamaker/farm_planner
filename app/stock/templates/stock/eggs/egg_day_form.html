{% extends "base.html" %}

{% block title %}
<h2>{{title}}</h2>
{% endblock title %}

{% block content %}

<form
    action="{% url 'stock:egg_day_form' %}"
    method="post"
>
    {% csrf_token %}
    

    <div class="row">

        <div class="form-group col-4">
            {{ form.date.as_field_group }}
        </div>
        <div class="form-group col-8">
            {{ form.quantity.as_field_group }}
        </div>

    </div>

    <input type="submit" value="Submit">
</form>

{% endblock content %}
