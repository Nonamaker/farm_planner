{% extends "base.html" %}

{% block title %}
<h2>{{title}}</h2>
{% endblock title %}

{% block content %}

<table class="table table-hover">
    <thead>
        <th scope="col">Summary</th>
    </thead>
    <tbody>
        {% for item in stock %}
        <tr>
            <td>
                <a href="{% url 'stock:hatch_update_form' item.pk %}">
                {{item.summary}}
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="1">No data to display</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content %}
